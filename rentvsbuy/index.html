<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>월세 vs 전세 비교기 - 당신에게 더 유리한 주거 형태는?</title>
  <meta name="description" content="월세 보증금, 월세액, 전세 보증금, 대출 금리를 입력하여 월별 주거 비용을 비교하고 합리적인 주거 선택을 도와주는 유틸리티입니다." />
  <style>
    :root {
      --bg: #f4f7fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #ff7a45;
      --accent-dark: #e9652e;
      --border: #e5e7eb;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header { text-align: center; padding: 32px 0 20px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .tagline { color: var(--muted); font-size: 15px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: var(--text); }
    h3 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; color: var(--accent); }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafbfc;
      color: var(--text);
      transition: border-color 0.15s;
    }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 480px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dashed var(--border);
    }
    .result-row:last-child { border-bottom: none; }
    .result-label { color: var(--muted); font-size: 14px; }
    .result-value { font-weight: 600; font-size: 15px; color: var(--text); }
    .highlight {
      background: linear-gradient(135deg, #fff5f0 0%, #ffe8dd 100%);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-top: 12px;
    }
    .highlight .badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .highlight .text { font-size: 18px; font-weight: 700; color: var(--accent-dark); }
    .funnel {
      text-align: center;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .funnel p { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .funnel a {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.15s;
    }
    .funnel a:hover { background: var(--accent-dark); }
    footer {
      text-align: center;
      padding: 24px 0;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>월세 vs 전세 비교기</h1>
      <p class="tagline">당신에게 더 유리한 주거 형태는?</p>
    </header>

    <div class="card">
      <h2>월세 조건</h2>
      <div class="field">
        <label for="rent_deposit">월세 보증금 (원)</label>
        <input type="number" id="rent_deposit" value="10000000" oninput="calc()" />
      </div>
      <div class="field">
        <label for="monthly_rent">월세액 (원)</label>
        <input type="number" id="monthly_rent" value="500000" oninput="calc()" />
      </div>
      <div class="field">
        <label for="rent_maintenance">월세 관리비 (원)</label>
        <input type="number" id="rent_maintenance" value="100000" oninput="calc()" />
      </div>
    </div>

    <div class="card">
      <h2>전세 조건</h2>
      <div class="field">
        <label for="jeonse_deposit">전세 보증금 (원)</label>
        <input type="number" id="jeonse_deposit" value="100000000" oninput="calc()" />
      </div>
      <div class="field">
        <label for="jeonse_loan_rate">전세 대출 금리 (%)</label>
        <input type="number" id="jeonse_loan_rate" value="3.5" step="0.1" oninput="calc()" />
      </div>
    </div>

    <div class="card">
      <h2>비교 결과</h2>
      <div class="result-row">
        <span class="result-label">월세 총 월 지출</span>
        <span class="result-value" id="rent_total_monthly">-</span>
      </div>
      <div class="result-row">
        <span class="result-label">전세 월 이자 비용</span>
        <span class="result-value" id="jeonse_total_monthly">-</span>
      </div>
      <div class="highlight">
        <div class="badge">추천</div>
        <div class="text" id="recommendation">-</div>
      </div>
    </div>

    <div class="funnel">
      <p>더 깊은 부동산 분석이 필요하신가요?</p>
      <a href="https://prometheus.example.com/ebook/housing-guide" target="_blank" rel="noopener">📘 합리적인 주거 선택 가이드 받기</a>
    </div>

    <footer>
      © 자룡봇 AI Research · Prometheus v2.0
    </footer>
  </div>

  <script>
    function fmt(n) {
      if (!isFinite(n) || isNaN(n)) return '-';
      return Math.round(n).toLocaleString('ko-KR') + '원';
    }

    function calc() {
      const rentDeposit = parseFloat(document.getElementById('rent_deposit').value) || 0;
      const monthlyRent = parseFloat(document.getElementById('monthly_rent').value) || 0;
      const rentMaint = parseFloat(document.getElementById('rent_maintenance').value) || 0;
      const jeonseDeposit = parseFloat(document.getElementById('jeonse_deposit').value) || 0;
      const jeonseRate = parseFloat(document.getElementById('jeonse_loan_rate').value) || 0;

      // 월세 총 월 지출 = 월세 + 관리비
      const rentTotal = monthlyRent + rentMaint;

      // 전세 월 이자 비용 = (전세보증금 - 보유현금) * 금리 / 12
      // 보유현금 = 월세보증금 + (월세총월지출 * 12) 정도의 1년치 운영자금이라고 가정
      // 단순화: 전세 보증금 전액을 대출로 가정하고 이자 계산
      const jeonseMonthlyInterest = (jeonseDeposit * (jeonseRate / 100)) / 12;

      // 기회비용 비교:
      // 월세는 보증금 + 월세로 지출
      // 전세는 보증금 묶임 + 이자 발생
      // 추가 자금이 필요한 만큼: max(0, 전세보증금 - 보유자금)
      // 보유자금 = 월세보증금 + 1년치 월세총액
      const availableCash = rentDeposit + rentTotal * 12;
      const additionalLoan = Math.max(0, jeonseDeposit - availableCash);
      const jeonseActualInterest = (additionalLoan * (jeonseRate / 100)) / 12;

      document.getElementById('rent_total_monthly').textContent = fmt(rentTotal);
      document.getElementById('jeonse_total_monthly').textContent = fmt(jeonseActualInterest);

      let rec = '';
      const diff = rentTotal - jeonseActualInterest;
      if (Math.abs(diff) < 50000) {
        rec = '두 방식 모두 비슷합니다';
      } else if (diff < 0) {
        rec = '💰 전세가 ' + fmt(Math.abs(diff)) + '/월 더 저렴합니다';
      } else {
        rec = '💡 월세가 ' + fmt(diff) + '/월 더 저렴합니다';
      }
      document.getElementById('recommendation').textContent = rec;
    }

    calc();
  </script>
</body>
</html>
