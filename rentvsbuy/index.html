<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월세 vs 전세 비교 계산기 | 나에게 유리한 주거 방식은?</title>
    <meta name="description" content="월세와 전세 중 어떤 주거 방식이 재정적으로 유리한지 계산하고 추천해 드립니다. 보증금, 월세, 전세금, 대출 이자율, 투자 수익률을 비교해 보세요.">
    <style>
        :root {
            --background-color: #f4f7fc;
            --card-background-color: #ffffff;
            --accent-color: #ff7a45;
            --text-color: #333333;
            --text-light-color: #666666;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--card-background-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            padding: 30px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        p.tagline {
            text-align: center;
            color: var(--text-light-color);
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }

        .input-group input[type="number"] {
            width: calc(100% - 20px);
            padding: 12px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
        }

        .input-group input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(255, 122, 69, 0.2);
        }

        .section-title {
            color: var(--accent-color);
            font-size: 1.4em;
            margin-top: 30px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        .results {
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .results p {
            font-size: 1.1em;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results p strong {
            color: var(--accent-color);
            font-size: 1.2em;
        }

        .recommendation {
            text-align: center;
            margin-top: 25px;
            padding: 15px;
            background-color: rgba(255, 122, 69, 0.1);
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--accent-color);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-light-color);
            font-size: 0.9em;
        }

        .funnel {
            margin-top: 40px;
            padding: 25px;
            background-color: var(--accent-color);
            color: #ffffff;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .funnel h3 {
            margin-top: 0;
            font-size: 1.5em;
            color: #ffffff;
        }

        .funnel p {
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .funnel a {
            display: inline-block;
            background-color: #ffffff;
            color: var(--accent-color);
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .funnel a:hover {
            background-color: #f0f0f0;
            color: var(--accent-color);
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.5em;
            }
            p.tagline {
                font-size: 1em;
            }
            .section-title {
                font-size: 1.2em;
            }
            .funnel h3 {
                font-size: 1.3em;
            }
            .funnel p {
                font-size: 1em;
            }
            .input-group input[type="number"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>월세 vs 전세 비교 계산기</h1>
        <p class="tagline">월세와 전세 중, 당신에게 더 유리한 선택은?</p>

        <div class="section-title">월세 정보 입력</div>
        <div class="input-group">
            <label for="deposit">월세 보증금 (원)</label>
            <input type="number" id="deposit" value="10000000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label for="rent">월세 (원)</label>
            <input type="number" id="rent" value="500000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label for="loan_interest_rent">월세 보증금 대출 이자율 (%)</label>
            <input type="number" id="loan_interest_rent" value="4" step="0.1" oninput="calculate()">
        </div>

        <div class="section-title">전세 정보 입력</div>
        <div class="input-group">
            <label for="jeonse">전세금 (원)</label>
            <input type="number" id="jeonse" value="100000000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label for="loan_interest_jeonse">전세 대출 이자율 (%)</label>
            <input type="number" id="loan_interest_jeonse" value="3.5" step="0.1" oninput="calculate()">
        </div>
        <div class="input-group">
            <label for="opportunity_cost_rate">전세금/보증금 투자 시 예상 수익률 (%)</label>
            <input type="number" id="opportunity_cost_rate" value="5" step="0.1" oninput="calculate()">
        </div>

        <div class="results">
            <p>월세의 월 총 주거비용: <strong id="total_cost_rent">0원</strong></p>
            <p>전세의 월 총 주거비용: <strong id="total_cost_jeonse">0원</strong></p>
            <div class="recommendation" id="recommendation"></div>
        </div>
    </div>

    <div class="funnel">
        <h3>주거 독립, 더 이상 혼자가 아닙니다.</h3>
        <p>현명한 주거 선택을 위한 심층 가이드, 지금 바로 확인하세요!</p>
        <a href="#link-to-ebook">주거 독립 가이드 전자책 보러가기</a>
    </div>

    <div class="footer">
        © 자룡봇 AI Research · Prometheus v2.0
    </div>

    <script>
        function calculate() {
            const deposit = parseFloat(document.getElementById('deposit').value) || 0;
            const rent = parseFloat(document.getElementById('rent').value) || 0;
            const loanInterestRent = parseFloat(document.getElementById('loan_interest_rent').value) || 0;
            const jeonse = parseFloat(document.getElementById('jeonse').value) || 0;
            const loanInterestJeonse = parseFloat(document.getElementById('loan_interest_jeonse').value) || 0;
            const opportunityCostRate = parseFloat(document.getElementById('opportunity_cost_rate').value) || 0;

            // 월세의 월 총 주거비용 계산 (월세 + 보증금 대출 이자 + 보증금 기회비용)
            const depositLoanInterest = (deposit * (loanInterestRent / 100)) / 12;
            const depositOpportunityCost = (deposit * (opportunityCostRate / 100)) / 12;
            const totalCostRent = rent + depositLoanInterest + depositOpportunityCost;

            // 전세의 월 총 주거비용 계산 (전세 대출 이자 + 전세금 기회비용)
            const jeonseLoanInterest = (jeonse * (loanInterestJeonse / 100)) / 12;
            const jeonseOpportunityCost = (jeonse * (opportunityCostRate / 100)) / 12;
            const totalCostJeonse = jeonseLoanInterest + jeonseOpportunityCost;

            document.getElementById('total_cost_rent').innerText = formatCurrency(totalCostRent) + '원';
            document.getElementById('total_cost_jeonse').innerText = formatCurrency(totalCostJeonse) + '원';

            let recommendationText = '';
            if (totalCostRent < totalCostJeonse) {
                recommendationText = '월세가 전세보다 재정적으로 유리합니다.';
            } else if (totalCostJeonse < totalCostRent) {
                recommendationText = '전세가 월세보다 재정적으로 유리합니다.';
            } else {
                recommendationText = '월세와 전세의 재정적 부담이 비슷합니다.';
            }
            document.getElementById('recommendation').innerText = recommendationText;
        }

        function formatCurrency(amount) {
            return Math.round(amount).toLocaleString('ko-KR');
        }

        // Initial calculation
        calculate();
    </script>
</body>
</html>
