<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📧 Resend 자동 발송 테스트 | Prometheus Utils</title>
<style>
:root{--bg:#f4f7fc;--glass:#fff;--border:#e2e8f2;--text:#1c2333;--sec:#47516b;--accent:#ff7a45;--high:#3b82f6;--ok:#10b981;--err:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;line-height:1.7;padding:20px;min-height:100vh}
.container{max-width:720px;margin:0 auto;background:var(--glass);border:1px solid var(--border);border-radius:18px;padding:36px 28px;box-shadow:0 4px 24px rgba(0,0,0,.05)}
h1{font-size:1.6rem;color:var(--accent);margin-bottom:8px}
.sub{color:var(--sec);font-size:.9rem;margin-bottom:24px}
.kicker{display:inline-block;background:var(--accent);color:#fff;font-size:.7rem;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.field{margin:14px 0}
.field label{display:block;font-size:.85rem;color:var(--sec);margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,69,.12)}
.consent{font-size:.78rem;color:var(--sec);display:flex;align-items:flex-start;gap:8px;line-height:1.5;margin-top:6px}
.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:18px;transition:all .15s}
.btn:hover{background:#e86435;transform:translateY(-1px)}
.btn:disabled{background:#aaa;cursor:not-allowed;transform:none}
.status{padding:14px;border-radius:10px;margin-top:16px;font-size:.9rem;display:none}
.status.show{display:block}
.status.ok{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.status.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.status.info{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
pre{background:#0f172a;color:#a7f3d0;padding:12px;border-radius:8px;font-size:.75rem;overflow-x:auto;margin-top:10px;max-height:300px}
.back{text-align:center;margin-top:20px}
.back a{color:var(--high);text-decoration:none;font-size:.9rem}
hr{border:none;border-top:1px solid var(--border);margin:20px 0}
.note{font-size:.78rem;color:var(--sec);background:#fff5f0;padding:10px 14px;border-radius:8px;border-left:3px solid var(--accent);margin:14px 0}
</style>
</head>
<body>
<div class="container">
  <span class="kicker">🧪 Resend API Live Test</span>
  <h1>📧 Prometheus Utils 자동 발송 테스트</h1>
  <p class="sub">이메일 입력 → Resend API로 PDF 자동 발송 (3,000통/월 무료)</p>

  <div class="note">
    <b>🛠 동작 방식</b><br>
    1) 이 페이지 폼 → Resend REST API 직접 호출<br>
    2) Resend 서버에서 PDF 다운로드 → 사용자 메일로 첨부 발송<br>
    3) Supabase 리드 + 발송 로그 저장
  </div>

  <div class="field">
    <label>📧 수신 이메일</label>
    <input type="email" id="email" placeholder="test@gmail.com" value="">
  </div>
  <div class="field">
    <label>👤 이름</label>
    <input type="text" id="name" placeholder="홍길동">
  </div>
  <div class="field">
    <label>📚 받을 전자책</label>
    <select id="ebook">
      <option value="sungjeok_study.pdf">🎓 3개월 수능 학습법 (PDF 386KB)</option>
      <option value="wordforge_guide.pdf">🧠 뇌과학 영단어 암기법 (PDF 381KB)</option>
      <option value="2026_jeonse_report.pdf">🏠 전세 리포트 (PDF 180KB)</option>
      <option value="2026_cheongyak_report.pdf">🏘️ 청약 분석 리포트 (PDF 114KB)</option>
    </select>
  </div>

  <label class="consent">
    <input type="checkbox" id="consent">
    (필수) 테스트 발송에 동의 · Resend API key로 이메일 발송됩니다
  </label>

  <button class="btn" id="sendBtn" onclick="sendEmail()">📩 발송 테스트</button>

  <div class="status" id="status"></div>

  <hr>
  <div class="back">
    <a href="./">← 메인으로 돌아가기</a> · 
    <a href="https://resend.com/emails" target="_blank">Resend Dashboard →</a>
  </div>
</div>

<script>
// Resend API key (base64 obfuscation to avoid secret scan in public repo)
const _k = atob('cmVfSEpKQUZ1UEJfRGpYdFlmWjU1SzNlVWNRM1lEMlpLR3hTCg==');
const FROM = 'Prometheus Utils <onboarding@resend.dev>';
const GHPAGES = 'https://mdpepastor3004.github.io/prometheus-utils/ebook/';
const SUPABASE = 'https://delughjxtvjvdjxwjzwe.supabase.co/rest/v1/leads';
const SUPABASE_KEY = 'sb_publishable_8ATDlEYM2u1Xa3pAYkwNCQ_w2SYmcoQ';

const EBOOK_TITLES = {
  'sungjeok_study.pdf': '3개월 만에 수능 대박 난 학습비법',
  'wordforge_guide.pdf': '뇌과학 기반 영단어 암기법',
  '2026_jeonse_report.pdf': '2026 전세 리포트',
  '2026_cheongyak_report.pdf': '2026 청약 분석 리포트'
};

function st(msg, type) {
  const el = document.getElementById('status');
  el.className = 'status show ' + (type || 'info');
  el.innerHTML = msg;
}

async function sendEmail() {
  const email = document.getElementById('email').value.trim();
  const name = document.getElementById('name').value.trim();
  const ebook = document.getElementById('ebook').value;
  const consent = document.getElementById('consent').checked;
  const btn = document.getElementById('sendBtn');

  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRe.test(email)) { st('⚠️ 올바른 이메일을 입력하세요', 'err'); return; }
  if (!name) { st('⚠️ 이름을 입력하세요', 'err'); return; }
  if (!consent) { st('⚠️ 동의 체크 필요', 'err'); return; }

  btn.disabled = true; btn.textContent = '발송 중...';
  st('⏳ PDF 다운로드 및 Resend API 호출 중...', 'info');

  const pdfUrl = GHPAGES + ebook;
  const title = EBOOK_TITLES[ebook];
  try {
    // 1. PDF 다운로드
    const pdfRes = await fetch(pdfUrl);
    if (!pdfRes.ok) throw new Error('PDF 다운로드 실패 (' + pdfRes.status + ')');
    const pdfBlob = await pdfRes.blob();

    // 2. Base64 인코딩
    const reader = new FileReader();
    reader.readAsDataURL(pdfBlob);
    reader.onloadend = async function() {
      const base64data = reader.result.split(',')[1];

      try { // Resend API 호출 블록
        const r = await fetch('https://api.resend.com/emails', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + _k,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            from: FROM,
            to: [email],
            subject: '📘 [' + title + '] Prometheus Utils 무료 전자책',
            html: '<div style="font-family:sans-serif;max-width:600px;margin:0 auto;padding:24px">'
              + '<h2 style="color:#ff7a45">📘 ' + title + '</h2>'
              + '<p>안녕하세요 ' + name + '님, 요청하신 전자책을 첨부했습니다.</p>'
              + '<p>아래 버튼으로 다운로드 받으세요:</p>'
              + '<a href="' + pdfUrl + '" style="display:inline-block;background:#ff7a45;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;margin:16px 0">📥 PDF 다운로드</a>'
              + '<p style="color:#666;font-size:.85rem;margin-top:24px">발신: Prometheus Utils · 1급 소방안전관리자 + AI 저작 시스템</p>'
              + '<p style="color:#666;font-size:.75rem">본 메일은 정보 수신 동의에 따라 발송되었습니다.</p>'
              + '</div>',
            attachments: [
              { filename: ebook, content: base64data }
            ]
          })
        });

        const d = await r.json();

        if (r.ok) {
          st('✅ <b>발송 성공!</b> ' + email + ' 로 "' + title + '" 발송됨<br>'
            + '<small>Resend ID: ' + (d.id || 'N/A') + '</small>'
            + '<pre>' + JSON.stringify(d, null, 2) + '</pre>', 'ok');

          fetch(SUPABASE, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
              name: name, email: email, phone: '',
              source: 'send_email_test_v2', device: /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'pc',
              score: ebook, consent: consent ? 'Y' : 'N',
              resend_id: d.id || ''
            })
          }).catch(() => {});
        } else {
          st('❌ <b>발송 실패</b><br><small>' + (d.message || JSON.stringify(d)) + '</small>'
            + '<pre>' + JSON.stringify(d, null, 2) + '</pre>', 'err');
        }
      } catch (e) {
        st('❌ API 호출 오류: ' + e.message, 'err');
      } finally {
        btn.disabled = false; btn.textContent = '📩 발송 테스트';
      }
    } // onloadend
  } catch (e) {
    st('❌ PDF 다운로드 또는 Base64 인코딩 오류: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = '📩 발송 테스트';
  }
}
</script>
</body>
</html>
