<style>
/* === PROMETHEUS CORE STYLES === */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f7fc;--bg2:#e9eef7;--glass:#ffffff;--glass2:#f8fafd;--border:#e2e8f2;
  --text:#1c2333;--sec:#47516b;--muted:#8b93a8;
  --accent:#ff7a45;--accent-l:#ffa066;--accent-d:#e85d2a;
  --danger:#ff5b5b;--warn:#ff9f43;--ok:#2fb3a0;
  --vhigh:#8b7cf6;--high:#2fb3a0;--mid:#ff9f43;--low:#ff5b5b;
  --cyan:#2fb3a0;--purple:#8b7cf6;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;line-height:1.6;min-height:100vh;padding:0}
.container{max-width:580px;margin:0 auto;padding:20px 16px 60px}

/* Header */
.header{text-align:center;padding:20px 0 16px;position:relative}
.header h1{font-size:1.4rem;color:var(--accent-l)}
.header .sub{color:var(--muted);font-size:.8rem;margin-top:4px}
.header .back-link{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--muted);text-decoration:none;font-size:.85rem}
.header .back-link:hover{color:var(--accent-l)}

/* Cards */
.card{background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.card h2{font-size:1rem;color:var(--sec);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card h2 .badge{background:var(--accent);color:#ffffff;font-size:.65rem;padding:2px 6px;border-radius:4px;font-weight:700;margin-left:auto}

/* Slider + Number Dual Input */
.slider-group{margin-bottom:14px}
.slider-group:last-child{margin-bottom:0}
.slider-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.slider-header label{font-size:.85rem;color:var(--sec)}
.slider-header .value-group{display:flex;align-items:center;gap:4px}
.slider-header .value-group input[type=number]{width:50px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:5px 6px;color:var(--accent-l);font-size:.85rem;font-weight:700;text-align:center;outline:none;-moz-appearance:textfield}
.slider-header .value-group input[type=number]::-webkit-inner-spin-button,.slider-header .value-group input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.slider-header .value-group input:focus{border-color:var(--accent)}
.slider-header .value-group .unit{color:var(--muted);font-size:.75rem}
.slider-header .value-group .score-badge{background:rgba(255,122,69,.15);color:var(--accent-l);font-size:.75rem;padding:2px 7px;border-radius:4px;font-weight:700}
.slider-track{position:relative;width:100%;height:6px;background:var(--bg2);border-radius:3px;margin-top:2px}
.slider-track input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:transparent;outline:none;position:absolute;top:0;left:0;z-index:2}
.slider-track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px rgba(255,122,69,.4);border:2px solid var(--glass)}
.slider-track input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--glass)}
.slider-track input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
.slider-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent-l));border-radius:3px;pointer-events:none;transition:width .15s ease}
.hint{font-size:.65rem;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}

/* Score Ring Gauge */
.score-ring{width:140px;height:140px;margin:0 auto 12px;position:relative}
.score-ring svg{transform:rotate(-90deg);width:140px;height:140px}
.score-ring .bg-circle{fill:none;stroke:var(--bg2);stroke-width:8}
.score-ring .fg-circle{fill:none;stroke:var(--accent-l);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .4s ease,stroke .3s}
.score-ring .center-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.score-ring .center-text .num{font-size:2.2rem;font-weight:800;color:var(--accent-l);line-height:1}
.score-ring .center-text .denom{font-size:.7rem;color:var(--muted)}
.score-ring .center-text .grade{font-size:.85rem;font-weight:700;margin-top:2px}
.grade-god{color:var(--vhigh)}.grade-high{color:var(--high)}.grade-mid{color:var(--mid)}.grade-low{color:var(--low)}

/* Breakdown Grid */
.breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.break-item{background:var(--bg2);border-radius:10px;padding:10px 6px;text-align:center;border:1px solid transparent}
.break-item .lbl{font-size:.65rem;color:var(--muted);margin-bottom:2px}
.break-item .val{font-size:1.2rem;font-weight:700}

/* Bar Chart */
.bar-chart{margin-top:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bar-row .bar-lbl{font-size:.7rem;color:var(--muted);width:40px;flex-shrink:0}
.bar-row .bar{height:14px;border-radius:7px;transition:width .3s ease;min-width:2px}
.bar-row .bar.bar-ok{background:linear-gradient(90deg,var(--high),var(--ok))}
.bar-row .bar.bar-mid{background:linear-gradient(90deg,var(--mid),var(--accent-l))}
.bar-row .bar.bar-low{background:linear-gradient(90deg,var(--danger),var(--warn))}
.bar-row .bar-val{font-size:.7rem;color:var(--sec);width:30px;flex-shrink:0}

/* Region Table */
.region-table{margin-top:12px}
.region-table .r-header{display:flex;justify-content:space-between;padding:6px 0;font-size:.7rem;color:var(--muted);border-bottom:1px solid var(--border)}
.region-table .r-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.8rem}
.region-table .r-row:last-child{border-bottom:none}
.region-table .r-row .r-name{color:var(--sec)}
.region-table .r-row .r-cut{color:var(--muted);font-size:.7rem}
.region-table .r-row .r-result{font-weight:700;font-size:.75rem;padding:2px 8px;border-radius:4px}
.region-table .r-row .r-result.pass{background:rgba(72,184,160,.15);color:var(--high)}
.region-table .r-row .r-result.fail{background:rgba(232,64,64,.1);color:var(--low)}

/* Verdict Banner */
.verdict-banner{padding:16px;border-radius:12px;margin-top:14px;text-align:center;font-size:.9rem;font-weight:700}
.verdict-banner.god{background:rgba(167,139,250,.12);border:1px solid var(--vhigh);color:var(--vhigh)}
.verdict-banner.high{background:rgba(72,184,160,.12);border:1px solid var(--high);color:var(--high)}
.verdict-banner.mid{background:rgba(255,122,69,.12);border:1px solid var(--mid);color:var(--mid)}
.verdict-banner.low{background:rgba(232,64,64,.08);border:1px solid var(--low);color:var(--low)}
.verdict-banner .detail{font-weight:400;font-size:.75rem;margin-top:4px;color:var(--sec)}

/* Share Bar */
.share-bar{display:flex;gap:8px;margin-top:14px}
.share-bar button{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--sec);cursor:pointer;font-size:.75rem;text-align:center;transition:all .1s}
.share-bar button:hover{border-color:var(--accent);color:var(--accent-l)}

/* Funnel / Lead Capture */
.funnel{margin-top:20px;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center}
.funnel .tag{display:inline-block;background:rgba(255,122,69,.12);color:var(--accent-l);font-size:.7rem;padding:2px 10px;border-radius:4px;margin-bottom:10px}
.funnel p{font-size:.85rem;color:var(--sec);margin-bottom:14px}
.funnel .lead-btn{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#ffffff;border:none;border-radius:8px;padding:14px 24px;font-size:1rem;font-weight:700;cursor:pointer;width:100%;box-shadow:0 4px 12px rgba(255,122,69,.25)}
.funnel .lead-btn:hover{transform:translateY(-1px)}
.funnel .lead-sub{font-size:.7rem;color:var(--muted);margin-top:8px}
.disclaimer{font-size:.65rem;color:var(--muted);text-align:center;margin-top:16px}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:var(--glass);border:1px solid var(--accent);border-radius:16px;padding:28px;max-width:400px;width:90%;position:relative}
.modal .close{position:absolute;top:12px;right:16px;color:var(--muted);cursor:pointer;font-size:1.2rem;background:none;border:none}
.modal h2{color:var(--accent-l);font-size:1.15rem;text-align:center;margin-bottom:6px}
.modal .desc{color:var(--sec);font-size:.8rem;text-align:center;margin-bottom:16px}
.modal .benefit{background:rgba(72,184,160,.08);border:1px solid var(--high);border-radius:10px;padding:14px;margin-bottom:16px;font-size:.8rem;color:var(--high)}
.modal .benefit b{display:block;font-size:.85rem;margin-bottom:6px}
.modal .field{margin-bottom:12px}
.modal input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.9rem;outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .error-msg{color:var(--danger);font-size:.8rem;display:none;text-align:center;margin-bottom:8px}
.modal .btn{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#ffffff;border:none;border-radius:8px;padding:12px;font-size:.95rem;font-weight:700;cursor:pointer;width:100%}
.modal .success{display:none;text-align:center}
.modal .success.active{display:block}
.modal .success .icon{font-size:2.5rem;margin-bottom:6px}
.modal .success h3{color:var(--high);font-size:1.05rem;margin-bottom:6px}
.modal .success p{color:var(--sec);font-size:.8rem;margin-bottom:14px}
.modal .success .dl-btn{display:inline-block;background:var(--accent);color:#ffffff;padding:10px 22px;border-radius:8px;text-decoration:none;font-weight:700}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--high);color:#ffffff;padding:12px 24px;border-radius:8px;font-weight:600;font-size:.9rem;z-index:2000;display:none;box-shadow:0 4px 12px rgba(28,35,51,.08)}
.toast.error{background:var(--danger)}
.toast.show{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Dropdown / Select */
select.t-d{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:.9rem;outline:none;cursor:pointer}
select.t-d:focus{border-color:var(--accent)}
</style>
{{STYLE_EXTRA}}
</head>
<body>
