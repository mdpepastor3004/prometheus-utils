<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💎 명품 구매 결정 계산기 (5초 진단) | Prometheus Utils</title><meta name="description" content="AI가 당신을 호구로 만들 결정을 미리 체험하는 5라운드 퀴즈"><style>:root{--bg:#f4f7fc;--glass:#fff;--border:#e2e8f2;--text:#1c2333;--sec:#47516b;--accent:#ff7a45;--good:#10b981;--bad:#ef4444;--ok:#3b82f6;--warn:#f59e0b}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;line-height:1.7;padding:16px;min-height:100vh}.container{max-width:520px;margin:0 auto}h1{font-size:1.4rem;margin-bottom:4px;text-align:center}.sub{color:var(--sec);font-size:.85rem;text-align:center;margin-bottom:16px}.progress{background:#e2e8f2;border-radius:99px;height:8px;margin:12px 0;overflow:hidden}.pbar{background:linear-gradient(90deg,var(--accent),var(--warn));height:100%;border-radius:99px;transition:width .4s}.step{font-size:.72rem;color:var(--sec);text-align:center;margin-bottom:6px}.card{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:24px 20px;box-shadow:0 4px 24px rgba(0,0,0,.06);margin-bottom:14px}.situation{font-size:1rem;font-weight:600;margin-bottom:14px;line-height:1.5}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--border);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:.92rem;transition:all .15s}.opt:hover{border-color:var(--accent);transform:translateY(-1px)}.opt.sel-good{border-color:var(--good);background:#d1fae5}.opt.sel-bad{border-color:var(--bad);background:#fee2e2}.opt.sel-ok{border-color:var(--warn);background:#fef3c7}.opt:disabled{opacity:.6;cursor:not-allowed}.feedback{margin-top:12px;padding:14px;border-radius:10px;font-size:.85rem;display:none;line-height:1.6}.feedback.show{display:block}.feedback.good{background:#d1fae5;border:1px solid #6ee7b7;color:#065f46}.feedback.bad{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}.feedback.ok{background:#fef3c7;border:1px solid #fcd34d;color:#78350f}.ai-warn{margin-top:10px;padding:10px 12px;background:#1e293b;color:#a7f3d0;border-radius:8px;font-size:.78rem;line-height:1.5}.ai-warn b{color:#fbbf24}.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px}.btn:hover{background:#e86435}.btn:disabled{background:#aaa;cursor:not-allowed}.share{background:var(--ok)}.share:hover{background:#059669}.final{display:none;text-align:center;padding:20px;border-radius:14px;background:linear-gradient(135deg,#fff5f0,#fff);border:2px solid var(--accent)}.final.show{display:block}.score-big{font-size:3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}.score-lbl{font-size:.85rem;color:var(--sec);margin-bottom:6px}.verdict{font-size:1.05rem;font-weight:700;margin:12px 0}.verdict.hoo{color:var(--bad)}.verdict.mid{color:var(--warn)}.verdict.safe{color:var(--good)}.coda{font-size:.78rem;color:var(--sec);margin:8px 0 16px}footer{text-align:center;margin-top:16px;color:var(--sec);font-size:.7rem}footer a{color:var(--accent);text-decoration:none}</style></head><body><div class="container"><h1>💎 💎 명품 구매 결정 계산기 (5초 진단)</h1><p class="sub">5라운드 · AI가 당신을 호구로 만들 명품 결정 체험</p><div class="step" id="step">1 / 5 라운드</div><div class="progress"><div class="pbar" id="pbar" style="width:20%"></div></div><div id="quiz"></div><div class="final" id="final"></div></div><footer>© Prometheus Utils · <a href="../../">더 많은 호갱백신 퀴즈</a></footer><script>var rounds = [{"situation": "백화점 매장에서 셀러가 '오늘만 30% 할인, 30분 뒤 끝나요' 합니다", "options": [["30% 할인이라면 일단 질러야지", "bad", "충동구매의 시작. '마감 압박'은 셀러의 가장 흔한 수법입니다."], ["비슷한 다른 매장도 비교해본다", "good", "이 한 마디면 셀러의 90% 수법이 무력화됩니다."], ["일단 카드를 꺼내본다 (결제는 나중에)", "bad", "카드 제시 = 심리적 계약. 안 사기로 해도 다음에 또 옵니다."]], "ai_would": "AI 추천 봇은 보통 '30%면 7만원 아끼는 셈, 3일 후엔 후회 없을 듯'이라고 답합니다. 그게 함정입니다."}, {"situation": "지인이 '이 가방 진짜야, 50만 원에 내줄게' 합니다. 정가 200만 원", "options": [["정가 대비 75% 할인, 대박 사자", "bad", "지인 사기(친족 사기)의 단골 수법. 50만 원 받고 사라집니다."], ["정가 확인 + 시리얼/영수증 요구", "good", "구매 전 진위 확인은 기본 중의 기본입니다."], ["일단 맡기고 내일 답할게", "ok", "미루기는 좋지만, '내일 생각할게'는 거절로 통하지 않을 수 있습니다."]], "ai_would": "AI는 '정가 대비 75% 할인은 의심해볼 만하다' 정도로 답하지만, 위험 신호는 직접 짚어주지 않습니다."}, {"situation": "한정판 '○○○ 1,000개 한정' SNS 광고, 10분 뒤 품절", "options": [["한정이라면 지금 질러야지", "bad", "한정 트리거는 충동구매 1위. 대부분 재고 풀려 있습니다."], ["브랜드 공식몰/오프라인 동시 확인", "good", "검증 가능한 채널에서만 구매하는 게 안전합니다."], ["리셀 가치 있을지 시세 확인", "ok", "리셀은 본전도 못 건질 확률 70%."]], "ai_would": "AI는 '리셀 가치는 변동성 크다' 정도. 진짜 한정판은 광고 없이도 3초 만에 품절입니다."}, {"situation": "중고 명품 거래, 판매자가 '지갑 들고 인증샷 보내줄게' 합니다", "options": [["인증샷 봤으니 안심", "bad", "인증샷은 위조 가능. 사진 한 장으로 진위 판별 불가."], ["공식 매장/감정사 동행 요청", "good", "직접 감정 받으면 100% 안전. 비용 1~2만 원."], ["가격이 정가 대비 50% 이하면 의심한다", "good", "50% 이하 = 99% 가품. 가격 자체가 신호입니다."]], "ai_would": "AI는 '감정 서비스를 권장합니다'라고 답하지만, 지금 이 사람이 99% 가품 팔이라는 경고는 안 합니다."}, {"situation": "한 번 산 명품, 3일 후 후회. 환불 요청할까요?", "options": [["3일 지났으니 포기", "bad", "전자상거래법상 7일 청약철구 가능. 포기 = 손해 확정."], ["판매자에게 먼저 연락", "ok", "가능하지만, 판매자 응 거부 시 2차 피해 가능."], ["플랫폼 소비자센터에 동시 접수", "good", "공식 채널 동시 접수 = 압박 효과 + 증거 확보."]], "ai_would": "AI는 '판매자와의 관계를 고려하세요' 정도로 답하지만, 법적 권리는 구체적으로 짚어주지 않습니다."}];var n = rounds.length;var idx = 0;var score = 0;var goodCount = 0;var badCount = 0;var okCount = 0;function showRound() {  if (idx >= n) { return showFinal(); }  var r = rounds[idx];  document.getElementById("step").textContent = (idx + 1) + " / " + n + " 라운드";  document.getElementById("pbar").style.width = Math.round(((idx + 1) / n) * 100) + "%";  var html = "<div class="card"><div class="situation">" + r.situation + "</div>";  for (var i = 0; i < r.options.length; i++) {    var o = r.options[i];    html += "<button class="opt" data-i="" + i + "" onclick="pick(this)">" + o[0] + "</button>";  }  html += "</div>";  document.getElementById("quiz").innerHTML = html;}function pick(btn) {  var i = parseInt(btn.dataset.i);  var r = rounds[idx];  var o = r.options[i];  var kind = o[1];  var comment = o[2];  if (kind === "good") { goodCount++; btn.classList.add("sel-good"); }  else if (kind === "bad") { badCount++; btn.classList.add("sel-bad"); }  else { okCount++; btn.classList.add("sel-ok"); }  var btns = document.querySelectorAll(".opt");  for (var j = 0; j < btns.length; j++) { btns[j].disabled = true; }  var fb = document.createElement("div");  fb.className = "feedback show " + kind;  fb.innerHTML = "<b>" + (kind === "good" ? "✅ 냉수 한잔!" : kind === "bad" ? "⚠️ 호구 신호" : "🤔 애매했어요") + "</b><br>" + comment;  var ai = document.createElement("div");  ai.className = "ai-warn";  ai.innerHTML = "<b>🤖 AI는 이렇게 답했을 겁니다:</b><br>" + r.ai_would;  btn.parentNode.appendChild(fb);  btn.parentNode.appendChild(ai);  var nb = document.createElement("button");  nb.className = "btn";  nb.textContent = (idx + 1 < n) ? "다음 라운드 →" : "결과 보기 →";  nb.onclick = function() { idx++; showRound(); };  btn.parentNode.appendChild(nb);}function showFinal() {  document.getElementById("step").textContent = "완료";  document.getElementById("pbar").style.width = "100%";  document.getElementById("quiz").style.display = "none";  var pct = Math.round((goodCount / n) * 100);  var verdict = "";  var verdictClass = "";  var coda = "";  if (pct >= 80) { verdict = "🛡️ 호구 면역 완료"; verdictClass = "safe"; coda = "위험 신호 즉시 감지. AI보다 한 수 위. 주변에 공유하세요."; }  else if (pct >= 50) { verdict = "⚠️ 면역 중 — 한 수만 더"; verdictClass = "mid"; coda = "AI 함정 절반은 피했지만, 결정적 순간에 흔들릴 수 있습니다."; }  else { verdict = "🚨 호구 고위험군"; verdictClass = "hoo"; coda = "AI 답변을 그대로 믿으면 큰 손해. 다른 사람의 체크리스트로 검증하세요."; }  var shareTxt = encodeURIComponent("💎 호갱백신 퀴즈 결과: " + verdict + " (" + pct + "점) — AI가 호구로 만들 결정을 미리 체험");  var shareUrl = "https://mdpepastor3004.github.io/prometheus-utils/micro_signals/services/";  var tg = "https://t.me/share/url?url=" + shareUrl + "&text=" + shareTxt;  var html = "<div class="score-lbl">냉수 한잔 점수</div><div class="score-big">" + pct + "점</div>";  html += "<div class="verdict " + verdictClass + "">" + verdict + "</div>";  html += "<div class="coda">" + coda + "</div>";  html += "<div style="font-size:.78rem;color:var(--sec);margin:14px 0"><b>내 점수:</b> 냉수 " + goodCount + " · 애매 " + okCount + " · 호구신호 " + badCount + "</div>";  html += "<a class="btn share" href="" + tg + "" target="_blank" style="display:block;text-decoration:none;text-align:center">📤 텔레그램으로 공유 — 친구 1명 호구 예방</a>";  html += "<a class="btn" href="../../" style="display:block;text-decoration:none;text-align:center;margin-top:8px;background:var(--high)">🔬 다른 호갱백신 퀴즈 풀기</a>";  document.getElementById("final").innerHTML = html;  document.getElementById("final").classList.add("show");}showRound();</script></body></html>
