<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💎 명품 구매 결정 계산기 (5초 진단) | Prometheus Utils</title><style>:root{--bg:#f4f7fc;--glass:#fff;--border:#e2e8f2;--text:#1c2333;--sec:#47516b;--accent:#ff7a45}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;line-height:1.7;padding:24px 16px}.card{max-width:480px;margin:0 auto;background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:28px 22px;box-shadow:0 4px 24px rgba(0,0,0,.06)}h1{font-size:1.3rem;margin-bottom:6px}.sub{color:var(--sec);font-size:.85rem;margin-bottom:20px}.q{margin:16px 0}.qlabel{display:block;font-weight:600;font-size:.92rem;margin-bottom:8px}.opt{display:block;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:.88rem;cursor:pointer}.opt:hover{border-color:var(--accent)}.opt input{margin-right:8px}.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px}.btn:hover{background:#e86435}.result{display:none;text-align:center;margin-top:20px;padding:18px;border-radius:12px;background:#fff5f0}.result.show{display:block}.advice{font-size:1rem;font-weight:700;margin-top:6px}footer{text-align:center;margin-top:20px;color:var(--sec);font-size:.7rem}footer a{color:var(--accent);text-decoration:none}</style></head><body><div class="card"><h1>💎 명품 구매 결정 계산기 (5초 진단)</h1><p class="sub">충동구매인지 진짜 필요인지 5초 안에 판단하세요</p><form id="qForm"><div class="q"><label class="qlabel">1. 이번 구매, 예산 대비 비중은?</label><label class="opt"><input type="radio" name="q1" value="1" required> 한 달 생활비 이하</label><label class="opt"><input type="radio" name="q1" value="2"> 한 달 생활비 수준</label><label class="opt"><input type="radio" name="q1" value="3"> 몇 달치 생활비</label></div><div class="q"><label class="qlabel">2. 6개월 후에도 쓸 것 같나요?</label><label class="opt"><input type="radio" name="q2" value="1" required> 매일 쓸 것 같음</label><label class="opt"><input type="radio" name="q2" value="2"> 가끔 쓸 듯</label><label class="opt"><input type="radio" name="q2" value="3"> 모르겠음</label></div><div class="q"><label class="qlabel">3. 대체할 수 있는 물건이 이미 있나요?</label><label class="opt"><input type="radio" name="q3" value="3" required> 이미 있음</label><label class="opt"><input type="radio" name="q3" value="2"> 비슷한 게 있음</label><label class="opt"><input type="radio" name="q3" value="1"> 없음</label></div><button type="button" class="btn" onclick="calc()">🎯 진단하기</button></form><div id="res" class="result"><div class="advice" id="advice"></div></div><script>function calc(){var inputs=document.querySelectorAll("input:checked");if(inputs.length<3){alert("모든 질문에 답해주세요");return}var t=0;inputs.forEach(function(i){t+=+i.value});var a=(t>=7?"충동구매 위험. 3일만 미뤄보세요.":(t>=4?"애매합니다. 예산을 다시 짜보세요.":(t>=0?"계획된 소비로 보입니다.":"진단 완료")));document.getElementById("advice").textContent=a;document.getElementById("res").classList.add("show")}</script><footer>© Prometheus Utils · <a href="../../">더 많은 무료 진단 도구</a></footer></div></body></html>
