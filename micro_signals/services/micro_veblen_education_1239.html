<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎓 자격증 ROI — 취득비 vs 연봉효과 | Prometheus Utils</title><style>:root{--bg:#f4f7fc;--glass:#fff;--border:#e2e8f2;--text:#1c2333;--sec:#47516b;--accent:#ff7a45}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;line-height:1.7;padding:24px 16px}.card{max-width:480px;margin:0 auto;background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:28px 22px;box-shadow:0 4px 24px rgba(0,0,0,.06)}h1{font-size:1.3rem;margin-bottom:6px}.sub{color:var(--sec);font-size:.85rem;margin-bottom:20px}.q{margin:16px 0}.qlabel{display:block;font-weight:600;font-size:.92rem;margin-bottom:8px}.opt{display:block;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:.88rem;cursor:pointer}.opt:hover{border-color:var(--accent)}.opt input{margin-right:8px}.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px}.btn:hover{background:#e86435}.result{display:none;text-align:center;margin-top:20px;padding:18px;border-radius:12px;background:#fff5f0}.result.show{display:block}.advice{font-size:1rem;font-weight:700;margin-top:6px}footer{text-align:center;margin-top:20px;color:var(--sec);font-size:.7rem}footer a{color:var(--accent);text-decoration:none}</style></head><body><div class="card"><h1>🎓 자격증 ROI — 취득비 vs 연봉효과</h1><p class="sub">자격증·교육 투자, 숫자로 따져보는 회수 가능성</p><form id="qForm"><div class="q"><label class="qlabel">1. 취득까지 걸리는 기간은?</label><label class="opt"><input type="radio" name="q1" value="3" required> 6개월 이내</label><label class="opt"><input type="radio" name="q1" value="2"> 1년</label><label class="opt"><input type="radio" name="q1" value="1"> 1년 이상</label></div><div class="q"><label class="qlabel">2. 취득 후 예상 소득 변화는?</label><label class="opt"><input type="radio" name="q2" value="3" required> 확실히 오름</label><label class="opt"><input type="radio" name="q2" value="2"> 불확실</label><label class="opt"><input type="radio" name="q2" value="1"> 변화 없을 듯</label></div><div class="q"><label class="qlabel">3. 현재 직무와 연관성은?</label><label class="opt"><input type="radio" name="q3" value="3" required> 직결됨</label><label class="opt"><input type="radio" name="q3" value="2"> 어느 정도</label><label class="opt"><input type="radio" name="q3" value="1"> 무관함</label></div><button type="button" class="btn" onclick="calc()">🎯 진단하기</button></form><div id="res" class="result"><div class="advice" id="advice"></div></div><script>function calc(){var inputs=document.querySelectorAll("input:checked");if(inputs.length<3){alert("모든 질문에 답해주세요");return}var t=0;inputs.forEach(function(i){t+=+i.value});var a=(t>=7?"투자 회수 가능성 높음.":(t>=4?"좀 더 알아보고 결정하세요.":(t>=0?"다른 대안을 먼저 검토하세요.":"진단 완료")));document.getElementById("advice").textContent=a;document.getElementById("res").classList.add("show")}</script><footer>© Prometheus Utils · <a href="../../">더 많은 무료 진단 도구</a></footer></div></body></html>
