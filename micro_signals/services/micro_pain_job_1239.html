<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💼 퇴사→실업급여→재취업 6개월 캐시플로우 | Prometheus Utils</title><style>:root{--bg:#f4f7fc;--glass:#fff;--border:#e2e8f2;--text:#1c2333;--sec:#47516b;--accent:#ff7a45}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;line-height:1.7;padding:24px 16px}.card{max-width:480px;margin:0 auto;background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:28px 22px;box-shadow:0 4px 24px rgba(0,0,0,.06)}h1{font-size:1.3rem;margin-bottom:6px}.sub{color:var(--sec);font-size:.85rem;margin-bottom:20px}.q{margin:16px 0}.qlabel{display:block;font-weight:600;font-size:.92rem;margin-bottom:8px}.opt{display:block;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:.88rem;cursor:pointer}.opt:hover{border-color:var(--accent)}.opt input{margin-right:8px}.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px}.btn:hover{background:#e86435}.result{display:none;text-align:center;margin-top:20px;padding:18px;border-radius:12px;background:#fff5f0}.result.show{display:block}.advice{font-size:1rem;font-weight:700;margin-top:6px}footer{text-align:center;margin-top:20px;color:var(--sec);font-size:.7rem}footer a{color:var(--accent);text-decoration:none}</style></head><body><div class="card"><h1>💼 퇴사→실업급여→재취업 6개월 캐시플로우</h1><p class="sub">퇴사 결정 전, 6개월 캐시플로우를 미리 확인하세요</p><form id="qForm"><div class="q"><label class="qlabel">1. 현재 재직 기간(고용보험 가입)은?</label><label class="opt"><input type="radio" name="q1" value="3" required> 1년 이상</label><label class="opt"><input type="radio" name="q1" value="2"> 6개월~1년</label><label class="opt"><input type="radio" name="q1" value="1"> 6개월 미만</label></div><div class="q"><label class="qlabel">2. 생활비 대비 저축 여유는?</label><label class="opt"><input type="radio" name="q2" value="3" required> 6개월치 이상</label><label class="opt"><input type="radio" name="q2" value="2"> 3개월치</label><label class="opt"><input type="radio" name="q2" value="1"> 1개월치 이하</label></div><div class="q"><label class="qlabel">3. 재취업 준비 상태는?</label><label class="opt"><input type="radio" name="q3" value="3" required> 이미 준비됨</label><label class="opt"><input type="radio" name="q3" value="2"> 일부 준비</label><label class="opt"><input type="radio" name="q3" value="1"> 전혀 없음</label></div><button type="button" class="btn" onclick="calc()">🎯 진단하기</button></form><div id="res" class="result"><div class="advice" id="advice"></div></div><script>function calc(){var inputs=document.querySelectorAll("input:checked");if(inputs.length<3){alert("모든 질문에 답해주세요");return}var t=0;inputs.forEach(function(i){t+=+i.value});var a=(t>=7?"퇴사 후 안정적으로 버틸 수 있습니다.":(t>=4?"3개월치 생활비를 더 모으고 결정하세요.":(t>=0?"재직하며 준비 기간을 더 가지세요.":"진단 완료")));document.getElementById("advice").textContent=a;document.getElementById("res").classList.add("show")}</script><footer>© Prometheus Utils · <a href="../../">더 많은 무료 진단 도구</a></footer></div></body></html>
