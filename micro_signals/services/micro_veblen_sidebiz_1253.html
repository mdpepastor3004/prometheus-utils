<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💸 부업 30일 손익분기 — 시갉 환산 | Prometheus Utils</title><meta name="description" content="AI가 당신을 호구로 만들 결정을 미리 체험하는 5라운드 퀴즈"><style>:root{--bg:#f4f7fc;--glass:#fff;--border:#e2e8f2;--text:#1c2333;--sec:#47516b;--accent:#ff7a45;--good:#10b981;--bad:#ef4444;--ok:#3b82f6;--warn:#f59e0b}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;line-height:1.7;padding:16px;min-height:100vh}.container{max-width:520px;margin:0 auto}h1{font-size:1.4rem;margin-bottom:4px;text-align:center}.sub{color:var(--sec);font-size:.85rem;text-align:center;margin-bottom:16px}.progress{background:#e2e8f2;border-radius:99px;height:8px;margin:12px 0;overflow:hidden}.pbar{background:linear-gradient(90deg,var(--accent),var(--warn));height:100%;border-radius:99px;transition:width .4s}.step{font-size:.72rem;color:var(--sec);text-align:center;margin-bottom:6px}.card{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:24px 20px;box-shadow:0 4px 24px rgba(0,0,0,.06);margin-bottom:14px}.situation{font-size:1rem;font-weight:600;margin-bottom:14px;line-height:1.5}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--border);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:.92rem;transition:all .15s}.opt:hover{border-color:var(--accent);transform:translateY(-1px)}.opt.sel-good{border-color:var(--good);background:#d1fae5}.opt.sel-bad{border-color:var(--bad);background:#fee2e2}.opt.sel-ok{border-color:var(--warn);background:#fef3c7}.opt:disabled{opacity:.6;cursor:not-allowed}.feedback{margin-top:12px;padding:14px;border-radius:10px;font-size:.85rem;display:none;line-height:1.6}.feedback.show{display:block}.feedback.good{background:#d1fae5;border:1px solid #6ee7b7;color:#065f46}.feedback.bad{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}.feedback.ok{background:#fef3c7;border:1px solid #fcd34d;color:#78350f}.ai-warn{margin-top:10px;padding:10px 12px;background:#1e293b;color:#a7f3d0;border-radius:8px;font-size:.78rem;line-height:1.5}.ai-warn b{color:#fbbf24}.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px}.btn:hover{background:#e86435}.btn:disabled{background:#aaa;cursor:not-allowed}.share{background:var(--ok)}.share:hover{background:#059669}.final{display:none;text-align:center;padding:20px;border-radius:14px;background:linear-gradient(135deg,#fff5f0,#fff);border:2px solid var(--accent)}.final.show{display:block}.score-big{font-size:3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}.score-lbl{font-size:.85rem;color:var(--sec);margin-bottom:6px}.verdict{font-size:1.05rem;font-weight:700;margin:12px 0}.verdict.hoo{color:var(--bad)}.verdict.mid{color:var(--warn)}.verdict.safe{color:var(--good)}.coda{font-size:.78rem;color:var(--sec);margin:8px 0 16px}footer{text-align:center;margin-top:16px;color:var(--sec);font-size:.7rem}footer a{color:var(--accent);text-decoration:none}</style></head><body><div class="container"><h1>💸 💸 부업 30일 손익분기 — 시갉 환산</h1><p class="sub">5라운드 · 부업·N잡 모집의 진짜 수익률 체험</p><div class="step" id="step">1 / 5 라운드</div><div class="progress"><div class="pbar" id="pbar" style="width:20%"></div></div><div id="quiz"></div><div class="final" id="final"></div></div><footer>© Prometheus Utils · <a href="../../">더 많은 호갱백신 퀴즈</a></footer><script>var rounds = [{"situation": "부업 모집 '월 300만 원 부업, 하루 2시간. 100만 원 교육비'", "options": [["300만 - 100만 = 200만 순수익", "bad", "월 300만 = 상위 5%, 하루 2시간 = 거의 불가."], ["수익 후기 + 평균 수익 분포 확인", "good", "평균과 분포 모두 봐야 진짜 그림이 나옵니다."], ["3일만 미뤄본다", "ok", "미루기 좋지만, 검증은 별도."]], "ai_would": "AI는 '개인이 다르다'고 답하지만, 월 300만 = 상위 5%라고 짚어주진 않습니다."}, {"situation": "스마트스토어 교육 '6개월 월 500만 원 보장. 등록비 200만 원'", "options": [["500만 보장 + 200만 = 5개월 회수", "bad", "보장 문구 = 마케팅, 실제 회수 기간 검증 필수."], ["3개월 후기 + 손익 시뮬레이션", "good", "3개월 후기 = 진짜 데이터입니다."], ["무료 자료로 먼저 학습", "ok", "무료 학습 후 판단은 좋지만, 교육 등록은 별도."]], "ai_would": "AI는 '노력이 중요하다'고 답하지만, 보장 문구의 허상은 짚어주지 않습니다."}, {"situation": "N잡 크리에이터 '인스타 1만 팔로워 = 월 100만 원. 50만 원 강의'", "options": [["1만 팔로워면 100만 원 가능", "bad", "팔로워 ≠ 수익. 광고 단가·전환율 별개."], ["강의자 실제 수익 공개 자료 확인", "good", "수익 공개 = 신뢰의 시작입니다."], ["무료로 검증할 수 있는지 본다", "ok", "무료 검증은 좋지만, 강의 등록은 별도."]], "ai_would": "AI는 '콘텐츠 품질이 핵심'이라고 답하지만, 1만 팔로워 ≠ 100만 원이라는 함정은 짚어주지 않습니다."}, {"situation": "부업 모집 '투자금 50만 원으로 일 5만 원 자동 수익'. 7일 체험", "options": [["7일 무료니까 해본다", "bad", "자동 수익 = 사기 단골, 체험 후 카드 청구 패턴."], ["자동 수익 구조 + 사업자 등록 확인", "good", "자동 수익은 한국에서 사업자 등록 필수입니다."], ["수익 구조 이해 전 결제 안 함", "good", "이해 없는 결제는 도박."]], "ai_would": "AI는 '주의가 필요하다'고 답하지만, 자동 수익 = 사기 단골이라고 짚어주진 않습니다."}, {"situation": "부업 시작 3개월, 월 30만 원밖에 안 벌임. 교육료 200만 원", "options": [["더 열심히 하면 늘겠지", "bad", "수익 정체 = 구조적 한계 가능성."], ["중단 + 다른 부업 검토", "good", "손절 시점 = 6개월 전이 일반적입니다."], ["일단 1년 더 해본다", "ok", "1년은 길지만, 검증은 가능."]], "ai_would": "AI는 '도전을 응원합니다'라고 답하지만, 손절 기준은 짚어주지 않습니다."}];var n = rounds.length;var idx = 0;var score = 0;var goodCount = 0;var badCount = 0;var okCount = 0;function showRound() {  if (idx >= n) { return showFinal(); }  var r = rounds[idx];  document.getElementById("step").textContent = (idx + 1) + " / " + n + " 라운드";  document.getElementById("pbar").style.width = Math.round(((idx + 1) / n) * 100) + "%";  var html = "<div class="card"><div class="situation">" + r.situation + "</div>";  for (var i = 0; i < r.options.length; i++) {    var o = r.options[i];    html += "<button class="opt" data-i="" + i + "" onclick="pick(this)">" + o[0] + "</button>";  }  html += "</div>";  document.getElementById("quiz").innerHTML = html;}function pick(btn) {  var i = parseInt(btn.dataset.i);  var r = rounds[idx];  var o = r.options[i];  var kind = o[1];  var comment = o[2];  if (kind === "good") { goodCount++; btn.classList.add("sel-good"); }  else if (kind === "bad") { badCount++; btn.classList.add("sel-bad"); }  else { okCount++; btn.classList.add("sel-ok"); }  var btns = document.querySelectorAll(".opt");  for (var j = 0; j < btns.length; j++) { btns[j].disabled = true; }  var fb = document.createElement("div");  fb.className = "feedback show " + kind;  fb.innerHTML = "<b>" + (kind === "good" ? "✅ 냉수 한잔!" : kind === "bad" ? "⚠️ 호구 신호" : "🤔 애매했어요") + "</b><br>" + comment;  var ai = document.createElement("div");  ai.className = "ai-warn";  ai.innerHTML = "<b>🤖 AI는 이렇게 답했을 겁니다:</b><br>" + r.ai_would;  btn.parentNode.appendChild(fb);  btn.parentNode.appendChild(ai);  var nb = document.createElement("button");  nb.className = "btn";  nb.textContent = (idx + 1 < n) ? "다음 라운드 →" : "결과 보기 →";  nb.onclick = function() { idx++; showRound(); };  btn.parentNode.appendChild(nb);}function showFinal() {  document.getElementById("step").textContent = "완료";  document.getElementById("pbar").style.width = "100%";  document.getElementById("quiz").style.display = "none";  var pct = Math.round((goodCount / n) * 100);  var verdict = "";  var verdictClass = "";  var coda = "";  if (pct >= 80) { verdict = "🛡️ 호구 면역 완료"; verdictClass = "safe"; coda = "위험 신호 즉시 감지. AI보다 한 수 위. 주변에 공유하세요."; }  else if (pct >= 50) { verdict = "⚠️ 면역 중 — 한 수만 더"; verdictClass = "mid"; coda = "AI 함정 절반은 피했지만, 결정적 순간에 흔들릴 수 있습니다."; }  else { verdict = "🚨 호구 고위험군"; verdictClass = "hoo"; coda = "AI 답변을 그대로 믿으면 큰 손해. 다른 사람의 체크리스트로 검증하세요."; }  var shareTxt = encodeURIComponent("💸 호갱백신 퀴즈 결과: " + verdict + " (" + pct + "점) — AI가 호구로 만들 결정을 미리 체험");  var shareUrl = "https://mdpepastor3004.github.io/prometheus-utils/micro_signals/services/";  var tg = "https://t.me/share/url?url=" + shareUrl + "&text=" + shareTxt;  var html = "<div class="score-lbl">냉수 한잔 점수</div><div class="score-big">" + pct + "점</div>";  html += "<div class="verdict " + verdictClass + "">" + verdict + "</div>";  html += "<div class="coda">" + coda + "</div>";  html += "<div style="font-size:.78rem;color:var(--sec);margin:14px 0"><b>내 점수:</b> 냉수 " + goodCount + " · 애매 " + okCount + " · 호구신호 " + badCount + "</div>";  html += "<a class="btn share" href="" + tg + "" target="_blank" style="display:block;text-decoration:none;text-align:center">📤 텔레그램으로 공유 — 친구 1명 호구 예방</a>";  html += "<a class="btn" href="../../" style="display:block;text-decoration:none;text-align:center;margin-top:8px;background:var(--high)">🔬 다른 호갱백신 퀴즈 풀기</a>";  document.getElementById("final").innerHTML = html;  document.getElementById("final").classList.add("show");}showRound();</script></body></html>
