<!-- Today's Stats -->
<div class="card" style="text-align:center">
<div style="display:flex;justify-content:space-around;gap:8px">
<div><div style="font-size:1.5rem;font-weight:800;color:var(--accent-l)" id="wfDue">0</div><div style="font-size:.7rem;color:var(--muted)">복습 예정</div></div>
<div><div style="font-size:1.5rem;font-weight:800;color:var(--high)" id="wfDone">0</div><div style="font-size:.7rem;color:var(--muted)">오늘 학습</div></div>
<div><div style="font-size:1.5rem;font-weight:800;color:var(--sec)" id="wfTotal">0</div><div style="font-size:.7rem;color:var(--muted)">전체 단어</div></div>
</div>
<div class="bar-chart" style="margin-top:10px">
<div class="bar-row"><span class="bar-lbl">진도율</span><div class="bar bar-ok" id="wfProgBar" style="width:0%"></div><span class="bar-val" id="wfProgLbl">0%</span></div>
</div>
</div>

<!-- Card Area -->
<div class="card" style="text-align:center;min-height:240px;position:relative" id="wfCardArea">
<div id="wfEmpty" style="display:none;padding:40px 0">
<div style="font-size:2.5rem;margin-bottom:12px">🎉</div>
<h3 style="color:var(--high);margin-bottom:8px">오늘의 복습 완료!</h3>
<p style="color:var(--sec);font-size:.85rem">새 단어를 추가해보세요</p>
</div>
<div id="wfCard" style="display:none">
<div style="font-size:.75rem;color:var(--muted);margin-bottom:8px" id="wfCardInfo">단어 1/1</div>
<div style="background:var(--bg2);border:2px solid var(--border);border-radius:16px;padding:24px 16px;margin-bottom:12px;cursor:pointer;transition:all .2s;user-select:none;min-height:140px;display:flex;flex-direction:column;justify-content:center;align-items:center" id="wfCardBody" onclick="flipCard()">
<div style="font-size:1.6rem;font-weight:700;color:var(--accent-l);margin-bottom:4px" id="wfFront">Word</div>
<div style="font-size:.8rem;color:var(--muted)" id="wfFrontSub">뜻을 보려면 탭하세요</div>
<div style="display:none;width:100%" id="wfBack">
<div style="font-size:1.1rem;color:var(--sec);margin-bottom:4px" id="wfMeaning">의미</div>
<div style="font-size:.85rem;color:var(--muted)" id="wfExample">예문</div>
</div>
</div>
<div style="display:flex;gap:8px">
<button style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--low);cursor:pointer;font-size:.85rem;font-weight:600" onclick="rateCard(0)">😰 까먹음</button>
<button style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--mid);cursor:pointer;font-size:.85rem;font-weight:600" onclick="rateCard(1)">🤔 애매함</button>
<button style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--high);cursor:pointer;font-size:.85rem;font-weight:600" onclick="rateCard(2)">✅ 잘 암기</button>
</div>
</div>
</div>

<!-- Add New Words -->
<div class="card">
<h2>➕ 새 단어 추가</h2>
<div class="field" style="margin-bottom:8px">
<input type="text" id="wfNewWord" placeholder="영단어 (e.g. abate)" style="display:block;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.9rem;outline:none;margin-bottom:6px">
<input type="text" id="wfNewMean" placeholder="의미 (e.g. 줄어들다, 약해지다)" style="display:block;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.9rem;outline:none;margin-bottom:6px">
<input type="text" id="wfNewEx" placeholder="예문 (선택)" style="display:block;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:.9rem;outline:none;margin-bottom:6px">
</div>
<div style="display:flex;gap:8px;margin-top:8px">
<button style="flex:1;background:var(--accent);color:#0e0e18;border:none;border-radius:8px;padding:12px;font-size:.9rem;font-weight:700;cursor:pointer" onclick="addWord()">추가</button>
<button style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--sec);cursor:pointer;font-size:.85rem" onclick="addSampleWords()">샘플 5개</button>
</div>
</div>

<!-- Settings -->
<div class="card">
<h2>⚙️ 설정</h2>
<div class="field" style="margin-bottom:8px">
<label style="font-size:.8rem;color:var(--sec);margin-bottom:4px;display:block">일일 신규 단어</label>
<input type="number" id="wfDailyNew" value="10" min="1" max="50" style="width:80px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--accent-l);font-size:.9rem;font-weight:700;text-align:center;outline:none" onchange="updateSettings()">
</div>
<div class="share-bar" style="margin-top:12px">
<button onclick="exportWords()">💾 내보내기</button>
<button onclick="document.getElementById('wfImport').click()">📥 가져오기</button>
<button onclick="if(confirm('모든 데이터를 초기화할까요?'))resetAll()">🗑️ 초기화</button>
</div>
<input type="file" id="wfImport" accept=".json" style="display:none" onchange="importWords(event)">
</div>
